<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkForest — AI 투자 토론</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-2: #1a1a26;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-dim: #8888a0;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --green: #4caf50;
            --yellow: #ffc107;
            --red: #f44336;
            --orange: #ff9800;
            --magenta: #e040fb;
            --cyan: #00bcd4;
            --user-bg: #1a1a3a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        .top-bar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
        }
        .top-bar h1 { font-size: 1.2rem; font-weight: 700; }
        .top-bar h1 span { color: var(--accent); }
        .top-bar-right { display: flex; gap: 0.8rem; align-items: center; }
        .top-bar-right input, .top-bar-right select {
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
            padding: 0.4rem 0.6rem; color: var(--text); font-size: 0.8rem; outline: none;
        }

        /* Mode tabs */
        .mode-tabs {
            background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; justify-content: center; gap: 0;
        }
        .mode-tab {
            background: none; border: none; color: var(--text-dim); padding: 0.6rem 2rem;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
            font-family: inherit; transition: all 0.2s;
        }
        .mode-tab:hover { color: var(--text); background: var(--surface-2); }
        .mode-tab.active { color: var(--magenta); border-bottom-color: var(--magenta); }

        .phase-bar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0.5rem 1.5rem; display: flex; align-items: center; justify-content: center; gap: 1.5rem;
        }
        .phase-dot { display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; color: var(--text-dim); }
        .phase-dot .dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.3s;
        }
        .phase-dot .dot.active { background: var(--magenta); box-shadow: 0 0 6px var(--magenta); }
        .phase-dot .dot.done { background: var(--green); }

        .chat-container {
            flex: 1; overflow-y: auto; padding: 1rem 1.5rem; max-width: 900px;
            margin: 0 auto; width: 100%;
        }

        .msg { margin-bottom: 1rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .msg-system { text-align: center; font-size: 0.8rem; color: var(--text-dim); padding: 0.5rem; font-style: italic; }
        .msg-user { display: flex; justify-content: flex-end; }
        .msg-user .bubble {
            background: var(--user-bg); border: 1px solid #2a2a5a; border-radius: 16px 16px 4px 16px;
            padding: 0.7rem 1rem; max-width: 70%; font-size: 0.9rem;
        }

        .msg-agent { display: flex; flex-direction: column; gap: 0.3rem; }
        .msg-agent .agent-label { font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .msg-agent .agent-label .badge { font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 10px; font-weight: 600; }
        .msg-agent .bubble {
            background: var(--surface); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px;
            padding: 0.8rem 1rem; max-width: 85%; font-size: 0.88rem; white-space: pre-wrap;
        }
        .agent-fundamental .agent-label { color: #4fc3f7; }
        .agent-fundamental .bubble { border-left: 3px solid #4fc3f7; }
        .agent-valuation .agent-label { color: var(--green); }
        .agent-valuation .bubble { border-left: 3px solid var(--green); }
        .agent-risk .agent-label { color: var(--orange); }
        .agent-risk .bubble { border-left: 3px solid var(--orange); }
        .agent-committee .agent-label { color: var(--magenta); }
        .agent-committee .bubble { border-left: 3px solid var(--magenta); }

        /* Macro agent colors */
        .agent-macro-economist .agent-label { color: #4fc3f7; }
        .agent-macro-economist .bubble { border-left: 3px solid #4fc3f7; }
        .agent-market-strategist .agent-label { color: var(--cyan); }
        .agent-market-strategist .bubble { border-left: 3px solid var(--cyan); }
        .agent-systemic-risk .agent-label { color: var(--orange); }
        .agent-systemic-risk .bubble { border-left: 3px solid var(--orange); }

        .badge-buy { background: #1b5e20; color: #a5d6a7; }
        .badge-wait { background: #f57f17; color: #fff9c4; }
        .badge-pass { background: #b71c1c; color: #ffcdd2; }
        .badge-needs_more_data { background: var(--surface-2); color: var(--text-dim); }
        .badge-macro { background: #1a237e; color: #90caf9; }

        .msg-verdict {
            background: var(--surface); border: 2px solid var(--magenta);
            border-radius: 12px; padding: 1.2rem; text-align: center; margin: 1rem 0;
        }
        .msg-verdict h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .confidence-bar { height: 6px; background: var(--surface-2); border-radius: 3px; max-width: 200px; margin: 0.5rem auto; overflow: hidden; }
        .confidence-fill { height: 100%; border-radius: 3px; }

        .verdict-details { text-align: left; margin-top: 1rem; font-size: 0.85rem; }
        .verdict-details h4 { font-size: 0.9rem; margin: 0.8rem 0 0.3rem; color: var(--text-dim); }
        .verdict-details li { padding: 0.2rem 0; }
        .verdict-details ul { list-style: none; padding: 0; }
        .verdict-details .point-agree::before { content: "+ "; color: var(--green); font-weight: bold; }
        .verdict-details .point-dissent::before { content: "? "; color: var(--yellow); font-weight: bold; }
        .verdict-details .point-risk::before { content: "! "; color: var(--red); font-weight: bold; }
        .verdict-details .point-action::before { content: "> "; color: var(--cyan); font-weight: bold; }
        .verdict-details .point-monitor::before { content: "@ "; color: var(--yellow); font-weight: bold; }

        .msg-loading { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span {
            width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%;
            animation: blink 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

        .input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 0.8rem 1.5rem; }
        .input-row { max-width: 900px; margin: 0 auto; display: flex; gap: 0.5rem; align-items: flex-end; }
        .input-row textarea {
            flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
            padding: 0.6rem 1rem; color: var(--text); font-size: 0.9rem; outline: none;
            resize: none; min-height: 42px; max-height: 120px; font-family: inherit; line-height: 1.5;
        }
        .input-row textarea:focus { border-color: var(--accent); }
        .input-row textarea::placeholder { color: var(--text-dim); }
        .send-btn {
            background: var(--accent); color: white; border: none; border-radius: 10px;
            width: 42px; height: 42px; cursor: pointer; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center; transition: background 0.2s;
        }
        .send-btn:hover { background: var(--accent-light); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .input-hint { max-width: 900px; margin: 0.3rem auto 0; font-size: 0.72rem; color: var(--text-dim); }

        .setup-panel {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            margin-bottom: 1rem; overflow: hidden;
        }
        .setup-toggle {
            width: 100%; background: none; border: none; color: var(--text); padding: 0.8rem 1rem;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: left;
            display: flex; justify-content: space-between; align-items: center; font-family: inherit;
        }
        .setup-toggle:hover { background: var(--surface-2); }
        .setup-body { padding: 0 1rem 1rem; display: none; }
        .setup-body.open { display: block; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin-bottom: 0.8rem; }
        .setup-grid label { font-size: 0.75rem; color: var(--text-dim); display: block; margin-bottom: 0.2rem; }
        .setup-grid input, .setup-grid select {
            width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
            padding: 0.5rem; color: var(--text); font-size: 0.85rem; outline: none; font-family: inherit;
        }
        .setup-grid textarea {
            width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
            padding: 0.5rem; color: var(--text); font-size: 0.85rem; outline: none; font-family: inherit;
            resize: vertical; min-height: 80px;
        }
        .setup-wide { grid-column: 1 / -1; }
        .setup-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
        .setup-actions button {
            background: var(--magenta); color: white; border: none; border-radius: 8px;
            padding: 0.6rem 1.5rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .setup-actions button:hover { opacity: 0.9; }
        .setup-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
        .setup-actions .btn-example { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

        .error-msg { background: #1a0000; border: 1px solid var(--red); border-radius: 8px; padding: 0.8rem; color: #ff8a80; font-size: 0.85rem; }
        .hidden { display: none !important; }

        /* Implication cards */
        .implication-card {
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
            padding: 0.6rem 0.8rem; margin: 0.3rem 0;
        }
        .implication-card .cat { font-size: 0.7rem; color: var(--cyan); font-weight: 600; text-transform: uppercase; }
        .implication-card .rec { font-size: 0.85rem; margin: 0.2rem 0; }
        .implication-card .rat { font-size: 0.75rem; color: var(--text-dim); }

        .risk-card {
            background: var(--surface-2); border-left: 3px solid var(--orange); border-radius: 0 8px 8px 0;
            padding: 0.5rem 0.8rem; margin: 0.3rem 0;
        }
        .risk-card .scenario { font-size: 0.85rem; }
        .risk-card .meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.2rem; }
        .risk-card .hedge { font-size: 0.8rem; color: var(--green); margin-top: 0.2rem; }

        /* Scenario analysis cards */
        .scenario-card {
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
            padding: 0.8rem; margin: 0.4rem 0;
        }
        .scenario-card .sc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
        .scenario-card .sc-name { font-size: 0.9rem; font-weight: 600; }
        .scenario-card .sc-prob { font-size: 0.75rem; color: var(--cyan); }
        .scenario-card .sc-desc { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem; }
        .scenario-card .sc-bar-row { display: flex; align-items: center; gap: 0.3rem; margin: 0.15rem 0; font-size: 0.75rem; }
        .scenario-card .sc-bar-label { width: 70px; text-align: right; color: var(--text-dim); }
        .scenario-card .sc-bar { flex: 1; height: 10px; background: var(--surface); border-radius: 3px; overflow: hidden; position: relative; }
        .scenario-card .sc-bar-fill { height: 100%; border-radius: 3px; position: absolute; }
        .scenario-card .sc-bar-val { width: 45px; font-size: 0.72rem; }
        .scenario-card .sc-signals { font-size: 0.72rem; color: var(--yellow); margin-top: 0.3rem; }
        .scenario-card .sc-hedges { font-size: 0.72rem; color: var(--green); margin-top: 0.2rem; }

        .stress-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; font-size: 0.8rem; border-bottom: 1px solid var(--border); }
        .stress-row:last-child { border-bottom: none; }
        .stress-name { flex: 1; }
        .stress-impact { width: 80px; text-align: right; font-weight: 600; }
        .stress-dd { width: 80px; text-align: right; color: var(--red); font-size: 0.75rem; }

        .alloc-bar-row { display: flex; align-items: center; gap: 0.4rem; margin: 0.2rem 0; font-size: 0.8rem; }
        .alloc-label { width: 80px; text-align: right; color: var(--text-dim); }
        .alloc-bar { flex: 1; height: 14px; background: var(--surface); border-radius: 3px; overflow: hidden; }
        .alloc-fill { height: 100%; background: var(--cyan); border-radius: 3px; }
        .alloc-pct { width: 40px; font-size: 0.75rem; }

        /* Market data ticker */
        .market-ticker {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0.3rem 1rem; overflow: hidden; font-size: 0.72rem; color: var(--text-dim);
            display: none; white-space: nowrap;
        }
        .market-ticker .ticker-inner {
            display: flex; gap: 1.5rem; align-items: center; flex-wrap: nowrap;
            overflow-x: auto; scrollbar-width: none;
        }
        .market-ticker .ticker-inner::-webkit-scrollbar { display: none; }
        .market-ticker .ticker-item { display: flex; gap: 0.3rem; align-items: center; flex-shrink: 0; }
        .market-ticker .ticker-name { color: var(--text-dim); }
        .market-ticker .ticker-val { color: var(--text); font-weight: 600; }
        .market-ticker .ticker-chg { font-size: 0.68rem; }
        .market-ticker .up { color: var(--red); }
        .market-ticker .down { color: #2196f3; }
        .market-ticker .ticker-src { margin-left: auto; font-size: 0.65rem; color: var(--text-dim); opacity: 0.5; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1><span>Dark</span>Forest</h1>
        <div class="top-bar-right">
            <input type="password" id="apiKey" placeholder="API Key (sk-ant-...)" style="width:180px;">
            <select id="model">
                <option value="claude-sonnet-4-20250514">Sonnet 4</option>
                <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
                <option value="claude-opus-4-6">Opus 4.6</option>
            </select>
        </div>
    </div>

    <!-- Mode Tabs -->
    <div class="mode-tabs">
        <button class="mode-tab active" id="tabStock" onclick="switchMode('stock')">종목 분석</button>
        <button class="mode-tab" id="tabMacro" onclick="switchMode('macro')">거시 경제 토론</button>
    </div>

    <!-- Market Ticker -->
    <div class="market-ticker" id="marketTicker">
        <div class="ticker-inner" id="tickerInner"></div>
    </div>

    <!-- Phase Bar -->
    <div class="phase-bar" id="phaseBar" style="display:none;">
        <div class="phase-dot"><div class="dot" id="pd1"></div><span>R1</span></div>
        <div class="phase-dot"><div class="dot" id="pdFb1"></div><span>피드백</span></div>
        <div class="phase-dot"><div class="dot" id="pd2"></div><span>R2</span></div>
        <div class="phase-dot"><div class="dot" id="pdFb2"></div><span>피드백</span></div>
        <div class="phase-dot"><div class="dot" id="pd3"></div><span>R3</span></div>
        <div class="phase-dot"><div class="dot" id="pdFb3"></div><span>피드백</span></div>
        <div class="phase-dot"><div class="dot" id="pdFinal"></div><span>판정</span></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chat">
        <div class="msg msg-system" id="welcomeMsg">DarkForest — 3명의 AI 애널리스트가 토론하고, 당신이 매 라운드마다 대화로 조율합니다.</div>

        <!-- Stock Setup Panel -->
        <div class="setup-panel" id="stockSetup">
            <button class="setup-toggle" onclick="togglePanel('stockSetupBody','stockArrow')">
                <span>종목 정보 입력</span>
                <span id="stockArrow">&#9660;</span>
            </button>
            <div class="setup-body open" id="stockSetupBody">
                <div class="setup-grid">
                    <div><label>Ticker</label><input type="text" id="hTicker" placeholder="005930"></div>
                    <div><label>종목명</label><input type="text" id="hName" placeholder="삼성전자"></div>
                    <div><label>자산 유형</label>
                        <select id="hType">
                            <option value="stock_kr">주식 (KR)</option>
                            <option value="stock_us">주식 (US)</option>
                            <option value="etf">ETF</option>
                            <option value="bond">채권</option>
                            <option value="crypto">암호화폐</option>
                        </select>
                    </div>
                    <div><label>수량</label><input type="number" id="hQty" value="100" min="0"></div>
                    <div><label>평균 매수가</label><input type="number" id="hAvgPrice" value="72000" min="0"></div>
                    <div><label>현재가</label><input type="number" id="hCurPrice" value="68000" min="0"></div>
                    <div><label>섹터</label><input type="text" id="hSector" placeholder="반도체"></div>
                    <div><label>매수 근거</label><input type="text" id="hMemo" placeholder="AI 반도체 수요 증가"></div>
                    <div><label>통화</label>
                        <select id="hCurrency">
                            <option value="KRW">KRW</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                    <div class="setup-wide">
                        <label>재무 데이터 (자유 형식)</label>
                        <textarea id="hFinancial" placeholder="2024 매출: 258조원 (+12% YoY)&#10;영업이익: 32조원&#10;PER: 12.5배&#10;ROE: 9.8%"></textarea>
                    </div>
                    <div class="setup-wide">
                        <label>리포트/참고 자료 (여러 건은 --- 구분)</label>
                        <textarea id="hReports" placeholder="증권사 리포트, 뉴스 등 텍스트로 붙여넣기..."></textarea>
                    </div>
                </div>
                <div class="setup-actions">
                    <button class="btn-example" onclick="loadStockExample()">예시 불러오기</button>
                    <button id="stockStartBtn" onclick="startStockDebate()">토론 시작</button>
                </div>
            </div>
        </div>

        <!-- Macro Setup Panel -->
        <div class="setup-panel hidden" id="macroSetup">
            <button class="setup-toggle" onclick="togglePanel('macroSetupBody','macroArrow')">
                <span>거시 경제 주제 입력</span>
                <span id="macroArrow">&#9660;</span>
            </button>
            <div class="setup-body open" id="macroSetupBody">
                <div class="setup-grid">
                    <div class="setup-wide">
                        <label>토론 주제</label>
                        <input type="text" id="mTopic" placeholder="예: 사모대출 사기 사태와 대규모 환매가 투자 시장에 미치는 영향">
                    </div>
                    <div class="setup-wide">
                        <label>배경 정보 / 참고 자료 (선택 — 뉴스, 데이터 등 자유 형식으로 붙여넣기)</label>
                        <textarea id="mContext" style="min-height:120px;" placeholder="관련 뉴스, 통계, 보고서 등을 자유롭게 붙여넣으세요.&#10;&#10;예시:&#10;- 사모대출 펀드 A사 환매 중단 (2025.12)&#10;- 관련 펀드 총 규모 약 3조원, 환매 요청 1.2조원&#10;- 금감원 실태 조사 착수&#10;- 연쇄 환매 우려로 채권 시장 변동성 확대"></textarea>
                    </div>
                </div>
                <div class="setup-actions">
                    <button class="btn-example" onclick="loadMacroExample()">예시 불러오기</button>
                    <button id="macroStartBtn" onclick="startMacroDebate()">토론 시작</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area" id="inputArea" style="display:none;">
        <div class="input-row">
            <textarea id="userInput" placeholder="의견을 입력하세요... (엔터로 전송, Shift+엔터로 줄바꿈)" rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendFeedback()">&#8593;</button>
        </div>
        <div class="input-hint" id="inputHint"></div>
    </div>

    <script>
        // ── State (per-mode) ──
        let currentMode = 'stock';
        const modeState = {
            stock: { sessionId: null, pendingAction: null, chatHTML: '', phaseDisplay: 'none', inputDisplay: 'none', inputHint: '' },
            macro: { sessionId: null, pendingAction: null, chatHTML: '', phaseDisplay: 'none', inputDisplay: 'none', inputHint: '' },
        };

        // Computed shortcuts (always point to current mode)
        function getSessionId() { return modeState[currentMode].sessionId; }
        function setSessionId(v) { modeState[currentMode].sessionId = v; }
        function getPendingAction() { return modeState[currentMode].pendingAction; }
        function setPendingAction(v) { modeState[currentMode].pendingAction = v; }

        const AGENT_CLS = {
            '펀더멘털 애널리스트': 'agent-fundamental',
            '밸류에이션 애널리스트': 'agent-valuation',
            '리스크 애널리스트': 'agent-risk',
            '거시 경제 전문가': 'agent-macro-economist',
            '시장 전략가': 'agent-market-strategist',
            '시스템 리스크 전문가': 'agent-systemic-risk',
        };
        const ROUND_NAMES = { opening: 'Round 1: 독립 분석', cross_examination: 'Round 2: 상호 반론', final: 'Round 3: 최종 입장' };

        const chat = document.getElementById('chat');
        const inputArea = document.getElementById('inputArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

        // ── Mode switching (state preserved) ──
        function switchMode(mode) {
            if (mode === currentMode) return;

            // Save current mode state
            const prev = modeState[currentMode];
            // Collect dynamic chat messages (exclude setup panels)
            const dynamicNodes = [...chat.children].filter(c => c.id !== 'welcomeMsg' && c.id !== 'stockSetup' && c.id !== 'macroSetup');
            prev.chatHTML = dynamicNodes.map(n => n.outerHTML).join('');
            prev.phaseDisplay = document.getElementById('phaseBar').style.display;
            prev.inputDisplay = inputArea.style.display;
            prev.inputHint = document.getElementById('inputHint').textContent;

            // Clear dynamic nodes
            dynamicNodes.forEach(n => n.remove());

            // Switch
            currentMode = mode;

            document.getElementById('tabStock').className = 'mode-tab' + (mode === 'stock' ? ' active' : '');
            document.getElementById('tabMacro').className = 'mode-tab' + (mode === 'macro' ? ' active' : '');
            document.getElementById('stockSetup').classList.toggle('hidden', mode !== 'stock');
            document.getElementById('macroSetup').classList.toggle('hidden', mode !== 'macro');

            document.getElementById('welcomeMsg').textContent = mode === 'stock'
                ? 'DarkForest — 3명의 AI 애널리스트가 토론하고, 당신이 매 라운드마다 대화로 조율합니다.'
                : 'DarkForest — 3명의 매크로 전문가가 거시 경제 이슈를 토론하고, 당신이 대화로 조율합니다.';

            // Restore new mode state
            const next = modeState[mode];
            if (next.chatHTML) {
                const temp = document.createElement('div');
                temp.innerHTML = next.chatHTML;
                while (temp.firstChild) chat.appendChild(temp.firstChild);
            }
            document.getElementById('phaseBar').style.display = next.phaseDisplay;
            inputArea.style.display = next.inputDisplay;
            document.getElementById('inputHint').textContent = next.inputHint;

            if (next.pendingAction) {
                userInput.disabled = false; sendBtn.disabled = false;
            }

            scrollBottom();
        }

        function togglePanel(bodyId, arrowId) {
            const body = document.getElementById(bodyId);
            const arrow = document.getElementById(arrowId);
            body.classList.toggle('open');
            arrow.textContent = body.classList.contains('open') ? '\u25B2' : '\u25BC';
        }

        // ── UI helpers ──
        function addSystemMsg(text) {
            const d = document.createElement('div');
            d.className = 'msg msg-system';
            d.textContent = text;
            chat.appendChild(d); scrollBottom();
        }
        function addUserMsg(text) {
            const d = document.createElement('div');
            d.className = 'msg msg-user';
            d.innerHTML = `<div class="bubble">${esc(text)}</div>`;
            chat.appendChild(d); scrollBottom();
        }
        function addAgentMsg(name, content, stance, confidence) {
            const cls = AGENT_CLS[name] || 'agent-committee';
            const stanceLabel = stance || '';
            const badgeCls = currentMode === 'macro' ? 'badge-macro' : `badge-${stance}`;
            const confText = confidence != null ? `${(confidence * 100).toFixed(0)}%` : '';

            const d = document.createElement('div');
            d.className = `msg msg-agent ${cls}`;
            d.innerHTML = `
                <div class="agent-label">
                    ${esc(name)}
                    ${stanceLabel ? `<span class="badge ${badgeCls}">${esc(stanceLabel)}</span>` : ''}
                    ${confText ? `<span style="font-size:0.7rem;color:var(--text-dim)">${confText}</span>` : ''}
                </div>
                <div class="bubble">${esc(content)}</div>
            `;
            chat.appendChild(d); scrollBottom();
        }
        function addLoading(text) {
            const d = document.createElement('div');
            d.className = 'msg msg-loading'; d.id = 'loadingMsg';
            d.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div><span style="font-size:0.8rem;color:var(--text-dim)">${esc(text)}</span>`;
            chat.appendChild(d); scrollBottom();
        }
        function removeLoading() { const el = document.getElementById('loadingMsg'); if (el) el.remove(); }
        function addError(text) {
            const d = document.createElement('div');
            d.className = 'msg';
            d.innerHTML = `<div class="error-msg">${esc(text)}</div>`;
            chat.appendChild(d); scrollBottom();
        }

        function setPhase(p) {
            document.getElementById('phaseBar').style.display = 'flex';
            const dots = ['pd1','pdFb1','pd2','pdFb2','pd3','pdFb3','pdFinal'];
            const map = { round1_running:0, round1_done:1, round2_running:2, round2_done:3, round3_running:4, round3_done:5, synthesized:6 };
            const idx = map[p] ?? -1;
            dots.forEach((id, i) => {
                document.getElementById(id).className = 'dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
            });
        }

        function renderRoundMessages(round) {
            const roundName = ROUND_NAMES[round.round_type] || `Round ${round.round_number}`;
            addSystemMsg(`── ${roundName} ──`);
            for (const msg of round.messages || []) {
                addAgentMsg(msg.agent_name, msg.content, msg.stance, msg.confidence);
            }
        }

        function enableInput(hint, action) {
            inputArea.style.display = 'block';
            userInput.disabled = false; sendBtn.disabled = false;
            document.getElementById('inputHint').textContent = hint;
            setPendingAction(action); userInput.focus();
        }
        function disableInput() { userInput.disabled = true; sendBtn.disabled = true; }

        async function sendFeedback() {
            const action = getPendingAction();
            if (!action) return;
            const text = userInput.value.trim();
            if (text) addUserMsg(text);
            userInput.value = ''; userInput.style.height = 'auto';
            disableInput();
            await action(text);
        }

        // ── MCDA Chart ──
        function addMCDAChart(mcda) {
            const labels = {
                business_quality: '사업 품질',
                financial_health: '재무 건전성',
                valuation: '밸류에이션',
                growth: '성장성',
                risk: '안전성',
                catalyst: '촉매',
                portfolio_fit: '포트폴리오 적합성',
            };
            const DECISION = { buy: 'BUY', wait: 'WAIT', pass: 'PASS', needs_more_data: 'HOLD' };
            const scores = mcda.criteria_scores || {};
            const ws = mcda.weighted_score || 0;
            const decision = DECISION[mcda.decision] || mcda.decision;
            const wsColor = ws >= 0.7 ? 'var(--green)' : ws >= 0.5 ? 'var(--yellow)' : 'var(--red)';

            let barsHTML = '';
            for (const [key, label] of Object.entries(labels)) {
                const val = scores[key] || 0;
                const pct = (val * 100).toFixed(0);
                const color = val >= 0.7 ? 'var(--green)' : val >= 0.5 ? 'var(--yellow)' : 'var(--red)';
                barsHTML += `
                    <div style="display:flex;align-items:center;gap:0.5rem;margin:0.3rem 0;">
                        <span style="width:100px;font-size:0.8rem;text-align:right;color:var(--text-dim);">${label}</span>
                        <div style="flex:1;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden;">
                            <div style="width:${pct}%;height:100%;background:${color};border-radius:3px;transition:width 0.5s;"></div>
                        </div>
                        <span style="width:35px;font-size:0.75rem;color:var(--text-dim);">${pct}%</span>
                    </div>`;
            }

            const d = document.createElement('div');
            d.className = 'msg';
            d.innerHTML = `
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin:0.5rem 0;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;">
                        <span style="font-size:0.85rem;font-weight:600;">MCDA 정량 분석</span>
                        <span style="font-size:0.75rem;color:var(--text-dim);">방법: ${esc(mcda.method || 'weighted_sum')}</span>
                    </div>
                    ${barsHTML}
                    <div style="margin-top:0.8rem;padding-top:0.6rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-size:0.85rem;">종합 점수: <strong style="color:${wsColor}">${(ws * 100).toFixed(0)}점</strong>/100</span>
                        <span class="badge badge-${mcda.decision}" style="font-size:0.8rem;padding:0.2rem 0.8rem;">정량 판정: ${decision}</span>
                    </div>
                </div>`;
            chat.appendChild(d); scrollBottom();
        }

        // ── Stock Verdict ──
        function addStockVerdict(result) {
            const DECISION = { buy: 'BUY', wait: 'WAIT', pass: 'PASS', needs_more_data: 'HOLD' };
            const label = DECISION[result.final_decision] || result.final_decision;
            const conf = ((result.final_confidence || 0) * 100).toFixed(0);
            const confColor = result.final_confidence >= 0.7 ? 'var(--green)' : result.final_confidence >= 0.5 ? 'var(--yellow)' : 'var(--red)';

            let html = `<div class="msg-verdict">
                <h3>투자위원회 최종 판정: <span class="badge badge-${result.final_decision}" style="font-size:1.1rem;padding:0.3rem 1rem;">${label}</span></h3>
                <div class="confidence-bar"><div class="confidence-fill" style="width:${conf}%;background:${confColor}"></div></div>
                <div style="font-size:0.85rem;">확신도: ${conf}%</div>
                <p style="margin-top:0.8rem;font-size:0.9rem;text-align:left;white-space:pre-wrap;">${esc(result.final_reasoning || '')}</p>
                <div class="verdict-details">`;
            if (result.consensus_points?.length) {
                html += `<h4>합의 포인트</h4><ul>`;
                for (const p of result.consensus_points) html += `<li class="point-agree">${esc(p)}</li>`;
                html += `</ul>`;
            }
            if (result.dissent_points?.length) {
                html += `<h4>의견 불일치</h4><ul>`;
                for (const p of result.dissent_points) html += `<li class="point-dissent">${esc(p)}</li>`;
                html += `</ul>`;
            }
            if (result.price_assessment) html += `<h4>적정가 평가</h4><p>${esc(result.price_assessment)}</p>`;
            if (result.risk_summary) html += `<h4>핵심 리스크</h4><p>${esc(result.risk_summary)}</p>`;
            if (result.action_items?.length) {
                html += `<h4>Action Items</h4><ul>`;
                for (const a of result.action_items) html += `<li class="point-action">${esc(a)}</li>`;
                html += `</ul>`;
            }
            html += `</div></div>`;
            const d = document.createElement('div'); d.className = 'msg'; d.innerHTML = html;
            chat.appendChild(d); scrollBottom();
        }

        // ── Macro Verdict ──
        function addMacroVerdict(result) {
            const conf = ((result.confidence || 0) * 100).toFixed(0);
            const confColor = result.confidence >= 0.7 ? 'var(--green)' : result.confidence >= 0.5 ? 'var(--yellow)' : 'var(--red)';

            let html = `<div class="msg-verdict" style="border-color:var(--cyan);">
                <h3>전략 회의 최종 권고: <span class="badge badge-macro" style="font-size:1.1rem;padding:0.3rem 1rem;">${esc(result.overall_stance || '중립')}</span></h3>
                <div class="confidence-bar"><div class="confidence-fill" style="width:${conf}%;background:${confColor}"></div></div>
                <div style="font-size:0.85rem;">확신도: ${conf}%</div>
                <p style="margin-top:0.8rem;font-size:0.9rem;text-align:left;white-space:pre-wrap;">${esc(result.executive_summary || '')}</p>
                <div class="verdict-details">`;

            if (result.consensus_points?.length) {
                html += `<h4>합의 포인트</h4><ul>`;
                for (const p of result.consensus_points) html += `<li class="point-agree">${esc(p)}</li>`;
                html += `</ul>`;
            }
            if (result.dissent_points?.length) {
                html += `<h4>의견 불일치</h4><ul>`;
                for (const p of result.dissent_points) html += `<li class="point-dissent">${esc(p)}</li>`;
                html += `</ul>`;
            }
            if (result.investment_implications?.length) {
                html += `<h4>투자 함의</h4>`;
                for (const imp of result.investment_implications) {
                    html += `<div class="implication-card">
                        <div class="cat">${esc(imp.category || '')}</div>
                        <div class="rec">${esc(imp.recommendation || '')}</div>
                        <div class="rat">${esc(imp.rationale || '')}</div>
                    </div>`;
                }
            }
            if (result.risk_scenarios?.length) {
                html += `<h4>리스크 시나리오</h4>`;
                for (const rs of result.risk_scenarios) {
                    html += `<div class="risk-card">
                        <div class="scenario">${esc(rs.scenario || '')}</div>
                        <div class="meta">확률: ${esc(rs.probability || '?')} / 영향: ${esc(rs.impact || '?')}</div>
                        ${rs.hedge ? `<div class="hedge">대응: ${esc(rs.hedge)}</div>` : ''}
                    </div>`;
                }
            }
            if (result.action_items?.length) {
                html += `<h4>지금 당장 해야 할 것</h4><ul>`;
                for (const a of result.action_items) html += `<li class="point-action">${esc(a)}</li>`;
                html += `</ul>`;
            }
            if (result.monitoring_points?.length) {
                html += `<h4>앞으로 주시할 것</h4><ul>`;
                for (const m of result.monitoring_points) html += `<li class="point-monitor">${esc(m)}</li>`;
                html += `</ul>`;
            }
            html += `</div></div>`;
            const d = document.createElement('div'); d.className = 'msg'; d.innerHTML = html;
            chat.appendChild(d); scrollBottom();

            // 시나리오 분석 결과 시각화
            if (result.scenario_analysis) addScenarioAnalysis(result.scenario_analysis);
        }

        // ── Scenario Analysis Visualization ──
        function addScenarioAnalysis(sa) {
            const ASSET_LABELS = {
                stock_kr:'한국 주식', stock_us:'미국 주식', bond_gov:'국채', bond_corp:'회사채',
                etf:'ETF', fund:'펀드', commodity:'원자재', real_estate:'부동산/리츠',
                crypto:'암호화폐', cash:'현금/MMF',
            };

            let html = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin:0.5rem 0;">
                <div style="font-size:0.95rem;font-weight:700;margin-bottom:0.8rem;color:var(--cyan);">시나리오 분석</div>`;

            // 시나리오 카드
            if (sa.scenarios?.length) {
                for (const s of sa.scenarios) {
                    const probPct = ((s.probability || 0) * 100).toFixed(0);
                    const sevColors = {경미:'var(--green)',중간:'var(--yellow)',심각:'var(--orange)',극단:'var(--red)'};
                    const sevColor = sevColors[s.severity] || 'var(--text-dim)';

                    html += `<div class="scenario-card">
                        <div class="sc-header">
                            <span class="sc-name">${esc(s.name)}</span>
                            <span class="sc-prob" style="color:${sevColor}">확률 ${probPct}% · ${esc(s.severity || '중간')}</span>
                        </div>
                        <div style="height:4px;background:var(--surface);border-radius:2px;margin-bottom:0.4rem;overflow:hidden;">
                            <div style="width:${probPct}%;height:100%;background:${sevColor};border-radius:2px;"></div>
                        </div>
                        <div class="sc-desc">${esc(s.description || '')}</div>`;

                    // 자산별 영향 바 차트
                    if (s.asset_impacts && Object.keys(s.asset_impacts).length) {
                        html += `<div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:0.2rem;">자산군별 영향</div>`;
                        const impacts = Object.entries(s.asset_impacts).sort((a,b) => a[1] - b[1]);
                        for (const [asset, impact] of impacts) {
                            const label = ASSET_LABELS[asset] || asset;
                            const absImpact = Math.min(Math.abs(impact), 30);
                            const pct = (absImpact / 30 * 50).toFixed(0);
                            const color = impact >= 0 ? 'var(--green)' : 'var(--red)';
                            const sign = impact >= 0 ? '+' : '';
                            const dir = impact >= 0 ? 'left:50%;' : `right:50%;`;
                            html += `<div class="sc-bar-row">
                                <span class="sc-bar-label">${esc(label)}</span>
                                <div class="sc-bar"><div class="sc-bar-fill" style="${dir}width:${pct}%;background:${color};"></div></div>
                                <span class="sc-bar-val" style="color:${color}">${sign}${impact.toFixed(1)}%</span>
                            </div>`;
                        }
                    }

                    if (s.key_signals?.length) {
                        html += `<div class="sc-signals">주시 신호: ${s.key_signals.map(esc).join(' / ')}</div>`;
                    }
                    if (s.hedges?.length) {
                        html += `<div class="sc-hedges">헤지: ${s.hedges.map(esc).join(' / ')}</div>`;
                    }
                    html += `</div>`;
                }
            }

            // 스트레스 테스트
            if (sa.stress_tests?.length) {
                html += `<div style="margin-top:0.8rem;font-size:0.85rem;font-weight:600;">스트레스 테스트</div>`;
                for (const st of sa.stress_tests) {
                    const impColor = st.portfolio_impact_pct >= 0 ? 'var(--green)' : 'var(--red)';
                    const sign = st.portfolio_impact_pct >= 0 ? '+' : '';
                    html += `<div class="stress-row">
                        <span class="stress-name">${esc(st.scenario_name)}</span>
                        <span class="stress-impact" style="color:${impColor}">${sign}${st.portfolio_impact_pct.toFixed(1)}%</span>
                        <span class="stress-dd">${st.max_drawdown_pct ? `MDD ${st.max_drawdown_pct.toFixed(1)}%` : ''}</span>
                    </div>`;
                }
            }

            // 최적 자산 배분
            if (sa.weighted_allocation && Object.keys(sa.weighted_allocation).length) {
                html += `<div style="margin-top:0.8rem;font-size:0.85rem;font-weight:600;">확률 가중 최적 자산 배분</div>`;
                const allocs = Object.entries(sa.weighted_allocation).sort((a,b) => b[1] - a[1]);
                for (const [asset, weight] of allocs) {
                    if (weight < 1) continue;
                    const label = ASSET_LABELS[asset] || asset;
                    html += `<div class="alloc-bar-row">
                        <span class="alloc-label">${esc(label)}</span>
                        <div class="alloc-bar"><div class="alloc-fill" style="width:${Math.min(weight, 100).toFixed(0)}%"></div></div>
                        <span class="alloc-pct">${weight.toFixed(0)}%</span>
                    </div>`;
                }
            }

            // 기대 수익률
            if (sa.expected_portfolio_return != null) {
                const ret = sa.expected_portfolio_return;
                const retColor = ret >= 0 ? 'var(--green)' : 'var(--red)';
                const retSign = ret >= 0 ? '+' : '';
                html += `<div style="margin-top:0.6rem;font-size:0.85rem;text-align:center;padding-top:0.5rem;border-top:1px solid var(--border);">
                    확률 가중 기대 수익률: <strong style="color:${retColor}">${retSign}${ret.toFixed(1)}%</strong>
                </div>`;
            }

            html += `</div>`;
            const d = document.createElement('div'); d.className = 'msg'; d.innerHTML = html;
            chat.appendChild(d); scrollBottom();
        }

        // ── Stock Flow ──

        async function startStockDebate() {
            const holding = collectHolding();
            if (!holding.ticker || holding.quantity <= 0) { alert('종목 정보를 입력하세요.'); return; }

            document.getElementById('stockStartBtn').disabled = true;
            document.getElementById('stockSetupBody').classList.remove('open');
            document.getElementById('stockArrow').textContent = '\u25BC';

            const portfolio = { name: 'Analysis', holdings: [holding] };
            addSystemMsg(`${holding.name} (${holding.ticker}) 토론을 시작합니다.`);
            addSystemMsg('실시간 시장 데이터를 수집하여 분석에 반영합니다.');
            addLoading('Round 1: 시장 데이터 수집 + 애널리스트 독립 분석 중...');

        // ── Market Data Ticker ──
        async function loadMarketData() {
            try {
                const res = await fetch('/api/market-data');
                if (!res.ok) return;
                const data = await res.json();
                if (!data.has_data) return;

                const ticker = document.getElementById('marketTicker');
                const inner = document.getElementById('tickerInner');
                inner.innerHTML = '';

                const items = [
                    ...(data.indices || []).map(i => ({name: i.name, val: i.value, chg: i.change, pct: i.change_pct, dec: 2})),
                    ...(data.exchange_rates || []).map(f => ({name: f.name, val: f.value, chg: f.change, pct: f.change_pct, dec: 2})),
                ];

                for (const item of items) {
                    const sign = item.chg >= 0 ? '+' : '';
                    const cls = item.chg >= 0 ? 'up' : 'down';
                    const el = document.createElement('span');
                    el.className = 'ticker-item';
                    el.innerHTML = `
                        <span class="ticker-name">${esc(item.name)}</span>
                        <span class="ticker-val">${item.val.toLocaleString(undefined, {minimumFractionDigits: item.dec, maximumFractionDigits: item.dec})}</span>
                        <span class="ticker-chg ${cls}">${sign}${item.pct.toFixed(2)}%</span>
                    `;
                    inner.appendChild(el);
                }

                if (data.timestamp) {
                    const src = document.createElement('span');
                    src.className = 'ticker-src';
                    src.textContent = data.timestamp;
                    inner.appendChild(src);
                }

                ticker.style.display = 'block';
            } catch(e) { /* ignore */ }
        }

        // 시장 데이터 로드 (페이지 로드 시 + 5분마다 갱신)
        loadMarketData();
        setInterval(loadMarketData, 300000);

        // ── Input handlers ──
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFeedback(); }
        });
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });
